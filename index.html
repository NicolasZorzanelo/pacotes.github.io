<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Monte seu plano de marketing</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#0B090A;--surface:#180A0E;--surface2:#2B0F17;--ink:#D6D6D6;--mute:#8C888A;--line:#3E1924;--tom:#A63A55;--tomglow:#C95B76;--tomsoft:#2B0F17;--bas:#4FCB8A;--bassoft:#132E21;--amb:#E5B54F;--ambsoft:#2E220D;--opt:#B4AEB0;--optsoft:#231419;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif;padding-bottom:48px}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.hero{padding:56px 0 28px}
header.hero.full-hero{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:64px 0 48px;position:relative;scroll-snap-align:start}
.hero-inner{max-width:42em}
.scroll-cue{margin-top:36px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;color:var(--mute);text-decoration:none;font-size:.92rem;font-weight:700;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:color .2s,border-color .2s,transform .2s}
.scroll-cue:hover{color:var(--ink);border-color:var(--tomglow);transform:translateY(2px)}
.snap-sec{scroll-margin-top:16px}
h1{font-size:clamp(2.2rem,7vw,3.6rem);font-weight:800;letter-spacing:-.02em;max-width:14em}
.lead{font-size:1.125rem;color:var(--mute);max-width:36em;margin:18px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:99px}
.tag.e{background:var(--tomsoft);color:var(--tomglow);border:1px solid rgba(201,91,118,.28)}.tag.i{background:var(--ambsoft);color:var(--amb)}.tag.o{background:var(--optsoft);color:var(--opt)}.tag.n{background:transparent;color:var(--mute);border:1px dashed var(--line)}
.pack{background:var(--ink);color:var(--bg);border-radius:22px;padding:28px;margin:12px 0 40px}
.pack h2{font-size:1.7rem;font-weight:800}
.pack p{margin:8px 0 0;opacity:.8;max-width:38em}
.steps{list-style:none;counter-reset:s;margin:22px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;font-size:.95rem}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--tom);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.steps b{display:block}.steps span{opacity:.75;font-size:.85rem}
.btn{font:700 1rem "DM Sans",sans-serif;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:var(--tom);color:#fff}
.btn:hover{background:var(--tomglow);box-shadow:0 6px 20px rgba(201,91,118,.32)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
.pr{font-weight:700;font-size:.95rem;white-space:nowrap}.pkcost{margin:0 0 16px;font-weight:700;font-size:1.05rem}.tag.cp{background:var(--bassoft);color:var(--bas)}.tag.ce{background:var(--optsoft);color:var(--opt)}.tag.cd{background:var(--ambsoft);color:var(--amb)}.tag.cs{background:transparent;color:var(--mute);border:1px dashed var(--line)}.it .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.tiers-wrap{position:relative;margin-top:18px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:stretch;padding-top:12px}
.tier{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:26px 20px 20px;display:flex;flex-direction:column;transition:border-color .25s ease,transform .25s ease}
.tier:hover{border-color:var(--tom)}
.pk-nav{display:none}
@media (max-width:768px){
 .tiers{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding:14px 4px 16px;scrollbar-width:none}
 .tiers::-webkit-scrollbar{display:none}
 .tier{flex:0 0 min(300px,84vw);scroll-snap-align:start}
 .pk-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
 .pk-dots{display:flex;gap:8px;align-items:center}
 .pk-dot{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:var(--line);cursor:pointer;transition:width .25s ease,background .25s ease}
 .pk-dot[aria-current=true]{width:24px;background:var(--tomglow)}
 .pk-arrows{display:flex;gap:8px}
 .pk-arr{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.05rem "DM Sans",sans-serif;display:grid;place-items:center;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
 .pk-arr:hover:not(:disabled){border-color:var(--tomglow);background:var(--surface2);color:#fff}
 .pk-arr:disabled{opacity:.35;cursor:default}
}
.tier.star{border-color:var(--tomglow);box-shadow:0 12px 36px rgba(166,58,85,.28);background:linear-gradient(180deg,#230C13 0%,var(--surface) 100%)}
.badge{position:absolute;top:-12px;left:20px;background:var(--tom);color:#fff;font:700 .78rem "DM Sans",sans-serif;padding:4px 12px;border-radius:99px;box-shadow:0 4px 14px rgba(166,58,85,.4)}
.tier h3{font-size:1.7rem;font-weight:800}
.tt{color:var(--mute);margin:6px 0 16px;font-size:.95rem}
.old{text-decoration:line-through;color:var(--mute);font-size:.85rem;margin:0}
.big{font:800 1.9rem/1.1 "Bricolage Grotesque",sans-serif;margin:4px 0}
.big small{font:500 1rem "DM Sans",sans-serif}
.sav{color:var(--bas);font-weight:700;font-size:.9rem;margin:2px 0 16px}
.inc{font-weight:700;margin:0 0 6px;font-size:.92rem}
.tier ul{margin:0 0 18px;padding-left:18px;font-size:.9rem;flex:1}
.tier ul li{margin:2px 0}
.tier .btn{width:100%}
.fn{color:var(--mute);font-size:.85rem;margin:14px 0 0}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}
.chip{font:500 .9rem "DM Sans",sans-serif;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.ph{margin-top:22px}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0}
summary::-webkit-details-marker{display:none}
summary h3{font-size:1.4rem;font-weight:800}
summary small{color:var(--mute);white-space:nowrap}
.items{display:grid;gap:8px}
.it{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.it:has(input:checked){border-color:var(--bas);background:var(--bassoft)}
.it.na{opacity:.55;cursor:default}
.it input{appearance:none;flex:none;width:24px;height:24px;margin:2px 0 0;border:2px solid var(--mute);border-radius:7px;display:grid;place-items:center;cursor:inherit}
.it input:checked{background:var(--bas);border-color:var(--bas)}
.it input:checked::after{content:"✓";color:#fff;font-weight:700;font-size:.9rem}
.it .t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.it b{font-weight:700}
.it p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cart-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:1.5px solid var(--tomglow);background:var(--tom);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.42),0 4px 14px rgba(166,58,85,.35);transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.cart-fab:hover{background:var(--tomglow);transform:translateY(-2px) scale(1.04);box-shadow:0 14px 32px rgba(0,0,0,.48),0 6px 18px rgba(201,91,118,.45)}
.cart-fab:active{transform:scale(.96)}
.cart-ico{font-size:1.35rem;line-height:1}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--bg);font:700 .78rem/22px "DM Sans",sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
dialog{border:0;border-radius:20px;padding:24px;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
textarea{width:100%;height:280px;margin:14px 0;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:400 .9rem/1.5 "DM Sans",sans-serif;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.empty{color:var(--mute);padding:16px 0}
footer{color:var(--mute);font-size:.85rem;padding:36px 0 0}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.fl{font-weight:700;font-size:.9rem;color:var(--mute);margin-right:4px;align-self:center}
.sec-h{font-size:1.8rem;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0 0}
button.ph{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;padding:22px;min-height:230px}
button.ph:hover{border-color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.12)}
button.ph:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
.ph .num{font:800 2.6rem/1 "Bricolage Grotesque","DM Sans",sans-serif;color:var(--tom)}
.ph h3{font-size:1.35rem;font-weight:800}
.ph p{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.bar2{height:6px;border-radius:9px;background:var(--optsoft);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--bas)}
.ph .ft{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--mute)}
.ph .open{position:absolute;top:18px;right:20px;font-size:1.3rem;color:var(--mute)}
.btn.small{padding:9px 16px;font-size:.9rem}
html:has(dialog[open]){overflow:hidden}
button.ph{transition:transform .46s cubic-bezier(.22,1,.36,1),opacity .38s ease,border-color .25s ease,box-shadow .25s ease}
.tiles.is-expanding button.ph:not(.is-active){opacity:.22;transform:scale(.93)}
.tiles.is-expanding button.ph.is-active{border-color:var(--tomglow);box-shadow:0 16px 40px rgba(166,58,85,.35)}
dialog.full{width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:var(--bg);color:var(--ink);overflow:hidden;will-change:transform,border-radius,opacity}
dialog.full::backdrop{background:rgba(11,9,10,.78);transition:opacity .42s cubic-bezier(.22,1,.36,1)}
dialog.full.is-closing::backdrop{opacity:0}
dialog.cart{margin:0 0 0 auto;width:min(460px,100%);max-width:100%;height:100dvh;max-height:none;padding:0;border:0;border-radius:22px 0 0 22px;background:var(--surface);color:var(--ink)}
dialog.cart[open]{animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
.cin{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px max(20px,calc((100% - 860px)/2)) 14px}
.dh h2{font-size:1.9rem;font-weight:800}.dh p{margin:6px 0 0;color:var(--mute)}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.dbody{flex:1;overflow:auto;padding:0 max(20px,calc((100% - 860px)/2)) 40px}
.cart .dh{padding:20px}.cart .dh h2{font-size:1.5rem}
.cbody{flex:1;overflow:auto;padding:0 20px 16px}
.cf{padding:14px 20px;border-top:1px solid var(--line)}
.cf textarea{height:140px;margin:0 0 10px}
.cl{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.cl li{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.cl small{display:block;color:var(--mute)}
.cl .pr2{color:var(--ink);font-weight:700}
.rm,.add{font:700 .85rem "DM Sans",sans-serif;border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.rm{background:transparent;color:var(--tom);border:1.5px solid var(--tom)}
.add{background:var(--bas);color:var(--bg);border:0}
.pk{display:flex;justify-content:space-between;gap:10px;background:var(--bassoft);color:var(--bas);border-radius:12px;padding:12px;margin-bottom:12px;font-size:.92rem}
.tot{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 0;border-top:2px solid var(--ink);margin-top:4px}
.tot b{font:800 1.15rem "Bricolage Grotesque","DM Sans",sans-serif;text-align:right}
.rh{font-size:1.15rem;font-weight:800;margin:20px 0 4px}
.ptxt{max-width:40em;color:var(--mute);font-size:1.05rem;margin:10px 0 0}
section.blk{margin-top:56px}
.sq3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.sq{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:var(--surface2);color:var(--ink);border:1.5px solid var(--line);border-radius:22px;padding:22px;text-decoration:none;overflow:hidden;transition:border-color .25s,transform .25s}
a.sq:hover{border-color:var(--tomglow);transform:translateY(-3px)}
.sq .ic{font:800 2.4rem/1 "Bricolage Grotesque","DM Sans",sans-serif;color:var(--tomglow);margin-bottom:auto}
.sq h3{font-size:1.4rem;font-weight:800}.sq p{margin:0;opacity:.8;font-size:.95rem;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){dialog.full[open],dialog.cart[open]{animation:none}button.ph{transition:none}}


.editfab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;font:700 .85rem "DM Sans",sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:9px 16px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.editfab[hidden]{display:none}
.edtabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 max(20px,calc((100% - 860px)/2)) 12px}
.edmsg{align-self:center;color:var(--mute);font-size:.85rem}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.fd{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--mute)}
.dbody input[type=text],.dbody input[type=number],.dbody textarea,.dbody select{font:400 .95rem "DM Sans",sans-serif;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;box-sizing:border-box}
.dbody textarea{height:auto;margin:0;resize:vertical}
.ecard{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;display:grid;gap:8px}
.erow{display:flex;gap:8px;align-items:center}.erow.wrap{flex-wrap:wrap;align-items:flex-end}
.erow label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:var(--mute);min-width:120px;flex:1}
.edh{font-size:1.25rem;font-weight:800;margin:22px 0 10px}
.ck{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-weight:400!important;color:var(--ink)!important}
.ck input{width:auto!important}
.cks{display:grid;gap:6px;margin-top:8px;max-height:260px;overflow:auto}
.sq p a{color:inherit;text-decoration:underline}
.cbody:focus{outline:none}
.rv{opacity:0;translate:0 34px;scale:.985;transition:opacity .9s cubic-bezier(.22,.61,.36,1) calc(var(--i,0)*110ms),translate .9s cubic-bezier(.22,.61,.36,1) calc(var(--i,0)*110ms),scale .9s cubic-bezier(.22,.61,.36,1) calc(var(--i,0)*110ms)}
.rv.in{opacity:1;translate:none;scale:none}
.hero .lead.rv,section>.lead.rv{--i:1}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;translate:none;scale:none;transition:none}}
.no-rv .rv{opacity:1;translate:none;scale:none;transition:none}
@media print{.rv{opacity:1;translate:none;scale:none;transition:none}}

.ed-hero-box{background:linear-gradient(135deg,var(--surface2) 0%,var(--surface) 100%);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.ed-hero-box h3{font-size:1.25rem;margin:0}
.ed-hero-box p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
.ed-sec-list{display:grid;gap:10px;margin-bottom:18px}
.ed-sec-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.ed-sec-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ed-sec-badge{font-size:.78rem;font-weight:700;color:var(--tomglow);background:var(--tomsoft);padding:3px 10px;border-radius:999px;border:1px solid rgba(201,91,118,.28)}
.ed-toggle{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;cursor:pointer;color:var(--ink)}
.ed-toggle input{width:18px;height:18px;accent-color:var(--bas);cursor:pointer}
@media (max-width:600px){
 body{font-size:15px}
 header.hero.full-hero{min-height:100dvh;padding:56px 0 40px}
 .scroll-cue{margin-top:26px;padding:9px 14px;font-size:.88rem}
 .sec-h{font-size:1.55rem}
 .cart-fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px}
 .cart-ico{font-size:1.22rem}
 .dh{padding:16px 16px 10px;gap:10px}
 .dh h2{font-size:1.45rem}
 .dbody{padding:0 16px 32px}
 .edtabs{padding:0 16px 10px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
 .edtabs::-webkit-scrollbar{display:none}
 .edtabs .chip{flex:none}
 .editfab{padding:8px 13px;font-size:.8rem}
}

.wk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.wk .seg,.wk .stp button{font:700 .8rem "DM Sans",sans-serif;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.wk .seg[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk .stp{display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.wk .stp b{font-size:.85rem;min-width:8.5em;text-align:center}
.wk .stp button{width:30px;height:30px;padding:0;border-radius:50%;font-size:1rem}

function isMobileCarousel(){return typeof window.matchMedia==="function"?window.matchMedia("(max-width: 768px)").matches:window.innerWidth<=768}

function setupCarousel(){
 var sc=$("tiers"),dots=$("pkdots"),prev=$("pkprev"),next=$("pknext");
 if(!sc||!dots||!prev||!next)return;
 var cards=sc.querySelectorAll(".tier");
 dots.innerHTML=[].map.call(cards,function(_,i){return '<button type="button" class="pk-dot" data-idx="'+i+'" aria-label="Ir para pacote '+(i+1)+'" aria-current="'+(i===0)+'"></button>'}).join("");
 function stepSize(){var c=cards[0];return c?(c.offsetWidth+14):314}
 function updNav(){
  if(!isMobileCarousel()){sc.scrollLeft=0;sc.style.cursor="";return}
  var max=sc.scrollWidth-sc.clientWidth;
  prev.disabled=sc.scrollLeft<=4;
  next.disabled=sc.scrollLeft>=max-4;
  var idx=Math.min(cards.length-1,Math.max(0,Math.round(sc.scrollLeft/stepSize())));
  [].forEach.call(dots.children,function(d,i){d.setAttribute("aria-current",String(i===idx))});
 }
 if(!sc._boundCarousel){
  sc._boundCarousel=true;
  sc.addEventListener("scroll",updNav,{passive:true});
  window.addEventListener("resize",updNav,{passive:true});
  prev.onclick=function(){if(!isMobileCarousel())return;sc.scrollBy({left:-stepSize(),behavior:"smooth"})};
  next.onclick=function(){if(!isMobileCarousel())return;sc.scrollBy({left:stepSize(),behavior:"smooth"})};
  dots.onclick=function(e){if(!isMobileCarousel())return;var b=e.target.closest(".pk-dot");if(b)sc.scrollTo({left:(+b.dataset.idx)*stepSize(),behavior:"smooth"})};
  var isDown=false,startX=0,startScroll=0,moved=false;
  sc.addEventListener("mousedown",function(e){if(!isMobileCarousel()||e.target.closest("button"))return;isDown=true;moved=false;startX=e.pageX;startScroll=sc.scrollLeft;sc.style.scrollSnapType="none";sc.style.cursor="grabbing"});
  window.addEventListener("mousemove",function(e){if(!isDown)return;var dx=e.pageX-startX;if(Math.abs(dx)>4)moved=true;sc.scrollLeft=startScroll-dx});
  window.addEventListener("mouseup",function(){if(!isDown)return;isDown=false;sc.style.scrollSnapType="x mandatory";sc.style.cursor=""});
  sc.addEventListener("click",function(e){if(moved){e.stopPropagation();moved=false}},true);
 }
 updNav();
}

function setupGuidedSections(){
 var allIds=["sec-intro","sec-pk","sec-sv","sec-about","sec-contact"];
 var btn=$("scrollNextBtn");
 var locked=false,cooldownUntil=0,touchStartY=0,touchStartX=0;
 var STEP_DELAY=840;
 function activeSecs(){
  return allIds.map($).filter(function(el){return el&&!el.hidden&&el.offsetParent!==null});
 }
 function tops(secs){
  var y=window.scrollY||0;
  return secs.map(function(el,idx){
   var raw=el.getBoundingClientRect().top+y;
   return idx===0?0:Math.max(0,raw-14);
  });
 }
 function nearestIndex(y,ts){
  var best=0,bestDist=Math.abs(y-ts[0]);
  for(var i=1;i<ts.length;i++){
   var d=Math.abs(y-ts[i]);
   if(d<bestDist){best=i;bestDist=d}
  }
  return best;
 }
 function goToIndex(idx,secs){
  var ts=tops(secs);
  if(idx<0||idx>=ts.length)return;
  locked=true;
  cooldownUntil=Date.now()+STEP_DELAY;
  window.scrollTo({top:ts[idx],behavior:"smooth"});
  setTimeout(function(){locked=false},640);
 }
 if(btn&&!btn._boundScroll){
  btn._boundScroll=true;
  btn.addEventListener("click",function(e){
   e.preventDefault();
   var secs=activeSecs();
   if(secs.length>1)goToIndex(1,secs);
  });
 }
 function stepBy(dir){
  if(locked||Date.now()<cooldownUntil||document.querySelector("dialog[open]"))return false;
  var secs=activeSecs();
  if(secs.length<2)return false;
  var y=window.scrollY||0;
  var ts=tops(secs);
  var idx=nearestIndex(y,ts);
  if(dir>0){
   if(y>=ts[idx]-22&&idx+1<ts.length){goToIndex(idx+1,secs);return true}
   for(var i=0;i<ts.length;i++){if(ts[i]>y+26){goToIndex(i,secs);return true}}
  }else if(dir<0){
   if(y<=ts[idx]+26&&idx-1>=0){goToIndex(idx-1,secs);return true}
   for(var j=ts.length-1;j>=0;j--){if(ts[j]<y-26){goToIndex(j,secs);return true}}
  }
  return false;
 }
 if(!window._boundGuided){
  window._boundGuided=true;
  window.addEventListener("wheel",function(e){
   if(document.querySelector("dialog[open]"))return;
   if(locked||Date.now()<cooldownUntil){e.preventDefault();return}
   if(Math.abs(e.deltaY)<28)return;
   if(stepBy(e.deltaY>0?1:-1))e.preventDefault();
  },{passive:false});
  window.addEventListener("touchstart",function(e){
   if(e.touches&&e.touches.length){
    touchStartY=e.touches[0].clientY;
    touchStartX=e.touches[0].clientX;
   }
  },{passive:true});
  window.addEventListener("touchend",function(e){
   if(locked||Date.now()<cooldownUntil||document.querySelector("dialog[open]")||!e.changedTouches||!e.changedTouches.length)return;
   var dy=touchStartY-e.changedTouches[0].clientY;
   var dx=Math.abs(touchStartX-e.changedTouches[0].clientX);
   if(dx>dy*0.85||Math.abs(dy)<64)return;
   stepBy(dy>0?1:-1);
  },{passive:true});
 }
}

function delItem(i){var id=DR.items[i].id;DR.items.splice(i,1);DR.pkgs.forEach(function(p){p.ids=p.ids.filter(function(x){return x!==id})});DR.items.forEach(function(x){if(x.inc)x.inc=x.inc.split(",").filter(function(y){return y!==id}).join(",")})}

function msg(t){$("edmsg").textContent=t}
function CSSTXT(){return document.getElementById("css").textContent}
function buildDoc(c){var j=JSON.stringify(c).replace(/</g,"\u003c");
 return '<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(document.title)+"</title>"+HEAD_LINKS+'<style id="css">'+CSSTXT()+'</style></head><body><noscript>Esta página precisa de JavaScript para exibir o conteúdo.</noscript><script id="cfg" type="application/json">'+j+'<\/script><script id="app">'+document.getElementById("app").textContent+"<\/script></body></html>"}

function applyLiveCFG(){
 var h1El=document.querySelector(".hero h1"),leadEl=document.querySelector(".hero .lead");
 if(h1El)h1El.textContent=CFG.text.h1;
 if(leadEl)leadEl.textContent=CFG.text.lead;
 var pkH=document.getElementById("pk");
 if(pkH)pkH.textContent=CFG.text.pkgsTitle||"Nossos pacotes prontos recomendados";
 var svH=document.getElementById("sv");
 if(svH)svH.textContent=CFG.text.builderTitle||"Monte o seu pacote";
 var aboutH=document.getElementById("tx");
 if(aboutH){
  aboutH.textContent=CFG.text.aboutTitle;
  var secAbout=aboutH.parentElement;
  while(secAbout.children.length>1)secAbout.lastElementChild.remove();
  secAbout.insertAdjacentHTML("beforeend",paras(CFG.text.about));
 }
 var ctH=document.getElementById("ct");
 if(ctH){
  ctH.textContent=CFG.text.contactTitle;
  var secCt=ctH.parentElement;
  while(secCt.children.length>1)secCt.lastElementChild.remove();
  secCt.insertAdjacentHTML("beforeend",contactHTML(CFG));
 }
 var ftEl=document.querySelector("footer");
 if(ftEl)ftEl.textContent=CFG.text.footer;
 applySections();
 renderTiers();
 refresh();
}

function edSave(){
 var order={};DR.items.forEach(function(x,i){order[x.id]=i});
 if(DR.items.some(function(x){return !String(x.name).trim()})){msg("Há um serviço sem nome.");return}
 DR.pkgs.forEach(function(p){if(!p.custom)p.ids.sort(function(a,b){return order[a]-order[b]})});
 var clean=sanitizeCFG(DR);
 for(var i=0;i<clean.pkgs.length;i++){var p=clean.pkgs[i],a=p.custom?{u:0,m:p.av}:tot(function(d){return p.ids.indexOf(d.id)>-1},clean.items,p.qty||{},clean.vol);
  if(p.u+p.m>a.u+a.m){msg("O pacote "+p.n+" custa mais que a soma dos itens ("+money(a.u+a.m)+"). Ajuste o preço.");return}}
 CFG=clean;D=CFG.items;PKG=CFG.pkgs;VOL=CFG.vol;
 applyLiveCFG();
 if(location.protocol!=="file:"){msg("Alterações aplicadas na página atual.");return}
 var docStr=buildDoc(clean);
 var blob=new Blob([docStr],{type:"text/html;charset=utf-8"});
 var url=URL.createObjectURL(blob);
 var a=document.createElement("a");
 var fname=decodeURIComponent((location.pathname.split("/").pop()||"index.html"));
 if(!/\.html?$/i.test(fname))fname="index.html";
 a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
 setTimeout(function(){URL.revokeObjectURL(url)},2000);
 msg("Arquivo salvo! Substitua o antigo pelo baixado ("+fname+").");
}

(function(){if(location.protocol==="file:"){$("editbtn").hidden=false}else{var b=$("editbtn"),d=$("edlg");if(b)b.remove();if(d)d.remove()}})();
